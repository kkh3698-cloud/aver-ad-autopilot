# 가게 정보 설정. API 키는 여기 넣지 마세요 (GitHub > Settings > Secrets 에만).
# "← 수정" 표시된 곳만 바꾸면 됩니다.

business:
  name: "엘핏 하양점"               # 네이버 플레이스 등록명 (순위 확인 시 이 이름으로 찾음)
  short_name: "엘핏"
  area: "하양"
  industry: "헬스장 · 1:1 PT 전문"
  match_address: "하양읍"          # 같은 이름 지점 구분용
  place_id: "1528879950"           # 네이버 플레이스 번호
  # 광고 클릭 시 열릴 주소: 비워두면 같은 광고그룹의 기존 소재 주소를 그대로 씁니다 (권장).
  # 네이버는 광고그룹에 등록된 사이트(비즈채널) 주소만 허용하므로 단축주소(naver.me)는 거절될 수 있음.
  landing_url: ""
  mobile_landing_url: ""
  value_per_conversion: 0          # 전환 1건 평균 가치(원). 0이면 리포트에서 ROAS 생략

place_tracking:
  provider: official               # official(공식 API, 상위 5개만) | browser(화면 순위, 약관 리스크)
  keywords:
    - "하양 헬스장"
    - "하양 헬스"
    - "하양 pt"
    - "경산 pt"
    - "하양 피티"
  alert_drop: 3                    # 이만큼 떨어지면 알림
  browser:
    url_template: "https://m.place.naver.com/place/list?query={query}"   # 화면 구조 바뀌면 수정
    max_items: 50
    delay_sec: [4, 9]
    ad_marker: "광고"

ads:
  dry_run: true                    # true: 승인해도 실제 생성/중지 안 하고 로그만. 확인 후 false
  managed_adgroups: auto           # auto: 계정에서 켜져 있는 파워링크 광고그룹 전부 (플레이스·쇼핑 광고 제외)
  # 특정 그룹만 관리하려면:
  # managed_adgroups:
  #   - { id: "grp-xxxx", name: "커트" }

  creative:
    lookback_days: 14
    min_active_ads: 2              # 이 수 밑으로는 절대 중지하지 않음
    max_active_ads: 4              # 활성+검수대기 소재 목표 수
    min_impressions: 1000          # 이 노출 미만 소재는 판정 보류
    min_conversions_for_cvr: 20    # 그룹 전환이 이 이상이면 '노출당 전환'으로 판정, 아니면 CTR
    lose_threshold: 0.05           # '최고일 확률' 5% 미만이면 패자 → 교체 제안
    min_age_days: 5                # 등록 후 이 기간 지나야 교체 대상
    headline_max: 15               # 네이버 텍스트 소재 제목 글자 수
    description_max: 45            # 설명 글자 수

  bidding:
    enabled: false                 # 소재 전용 모드: 입찰은 어떤 경로로도 바꾸지 않음 (API 클라이언트에서도 차단)
    # 아래는 enabled: true 로 바꿀 때만 사용
    lookback_days: 7
    target_cpa: 15000
    target_rank: 3
    max_step_pct: 15
    min_bid: 70
    max_bid: 3000
    min_clicks: 20
    cooldown_days: 3

  guardrails:
    max_changes_per_run: 10
    max_changes_per_day: 30
    kill_switch_file: "STOP"       # 이 파일을 만들면 모든 변경 중지 (touch STOP)

approvals:
  channel: github                  # github: 이슈에 👍/👎 로 승인 (무료, 서버 불필요) | telegram | cli
  github_users: []                 # 비우면 저장소 주인만 승인 가능
  max_open_per_adgroup: 2          # 광고그룹당 동시에 올라가 있는 제안 수 상한 (알림 폭탄 방지)
  expire_days: 7                   # 응답 없으면 만료
  telegram_user_ids: []            # channel: telegram 일 때만. 승인 권한자 텔레그램 숫자 ID

inspiration:
  refresh_days: 7                  # 이 주기로 업계 인기 콘텐츠를 새로 수집
  queries:                         # 업계 검색어 (손님이 찾는 말)
    - "하양 헬스장"
    - "하양 헬스"
    - "하양 pt"
    - "경산 pt"
    - "하양 피티"
    - "1:1 PT 후기"                 # 지역 검색어만으론 유튜브 결과가 적어서 업계 일반 검색어 추가
    - "헬스장 PT 처음"
  top_k: 12
  per_source: 6
  max_copied_chars: 10             # 참고 원문과 공백 제외 10자 이상 같으면 탈락 (베끼기 방지)
  competitor_names: ["피트밀리하양점", "피트밀리", "알로하피트니스", "알로하", "고도피티", "테일러점", "테일러"]
  sources:
    youtube:    { enabled: true, per_query: 25, days: 60, shorts_only: false }   # YOUTUBE_API_KEY 없으면 자동 건너뜀
    naver_blog: { enabled: true, per_query: 30 }                                 # 네이버 검색 키 없으면 자동 건너뜀
    manual:     { enabled: true, path: inspiration }                             # inspiration/*.csv

copygen:
  provider: auto                   # auto: ANTHROPIC_API_KEY 있으면 Claude(유료, 소액), 없으면 무료 템플릿
  model: claude-opus-5-5
  # 여기 적은 사실만 광고 문구에 쓰입니다. (출처: 네이버 플레이스 설명란, 2026-11-26)
  # 일부러 뺀 것: '교정운동 전문가'·'물리치료학과' (치료·교정이 의료 효과처럼 읽힐 수 있어 금지어로 막음),
  #               '완벽히 분리' → '분리' 로만 표현
  brand_notes: |
    - 업체: 엘핏 하양점 — 경북 경산시 하양읍, 1:1 PT 중심 프라이빗 PT센터(헬스장)
    - 방식: 운동 전 상담(운동 경험·생활습관·목적) → 현재 움직임 확인 → 개인별 목표 설정 → 맞춤 프로그램
    - 슬로건 성격의 표현: "움직임 분석 기반 1:1 PT", "운동 횟수보다 내 몸에 맞는 운동 방법을 배우는 것"
    - 목표별 프로그램: 다이어트, 자세 개선, 근력 강화, 체력 향상, 스포츠 퍼포먼스
    - 트레이너: 대표는 동국대학교(서울) 체육교육과 졸업, 2급 체육 정교사, 생활스포츠지도사 2급(보디빌딩), TPI 골프트레이닝 Lv.1·2
    - 운동 원리를 설명하며 1:1로 지도
    - 수업 후 운동 영상과 피드백 제공
    - PT 회원은 추가 요금 없이 헬스장 이용·개인운동 가능
    - 프라이빗 1:1 수업 환경, 탈의 공간·샤워 공간 분리
    - 등록 전 무료 체험 PT: 상담 + 움직임 확인 + 1:1 체험, 약 1시간~1시간 30분
    - 신규 회원 전용 1:1 PT 맛보기 3회 99,000원(회당 33,000원), 이용 조건은 상담 시 안내
    - 사전 예약제. 무료 체험은 네이버 예약, 3회 맛보기는 네이버 톡톡·전화 문의
    - 추천 대상: 운동을 처음 시작하는 분, 혼자 운동할 때 자세가 불안한 분, 꾸준한 운동 습관을 만들고 싶은 분
  # 업종 특화 규칙 (Claude 에게 그대로 전달)
  extra_rules: |
    - 운동·PT 광고입니다. 의료·치료 효과를 단정하거나 암시하지 마세요 (예: 고쳐드립니다, 치료, 완치, 통증 해결, 교정 보장).
    - 감량 수치·기간·결과를 약속하지 마세요 (예: 한 달 10kg, 요요 없음, 확실한 효과).
    - 과장 없이 담백하게: 시설·방식·위치·상담 같은 확인 가능한 사실 중심으로.
    - 가격(3회 99,000원)을 쓸 때는 반드시 '신규 회원 전용'임을 함께 밝히세요.
    - '무료 체험'은 '등록 전 무료 체험 PT'라는 사실 그대로만 쓰고, 조건 없는 공짜처럼 표현하지 마세요.
  banned_words: ["최고", "최저", "1위", "유일", "최초", "100%", "보장", "완벽", "무조건", "확실",
                 "치료", "완치", "고쳐", "고칩", "낫게", "낫는", "통증", "디스크", "교정", "처방", "의학",
                 "kg", "킬로", "요요", "기적", "단기간", "효과 보장", "책임"]
  templates:                       # Claude 키가 없을 때 쓰는 무료 기본 문구 (설명란 사실만)
    - { headline: "하양 1:1 PT 무료체험", description: "등록 전 무료 체험 PT. 상담과 움직임 확인 후 맞춤 운동을 안내합니다.", hypothesis: "무료 체험(진입 장벽 낮추기)" }
    - { headline: "하양 프라이빗 PT 엘핏", description: "1:1 PT 중심 프라이빗 헬스장. 탈의·샤워 공간 분리, 사전 예약제.", hypothesis: "프라이빗 환경" }
    - { headline: "PT 3회 99,000원", description: "신규 회원 전용 맛보기. 여러 번 수업해 보고 결정하세요. 하양읍 엘핏.", hypothesis: "가격 투명성" }
    - { headline: "혼자 운동이 막막할 때", description: "운동 목적과 움직임부터 확인하는 1:1 PT, 경산 하양 엘핏.", hypothesis: "고민 공감형" }
    - { headline: "하양 헬스장 엘핏 PT", description: "PT 회원은 추가 요금 없이 개인운동 가능. 운동 영상 피드백 제공.", hypothesis: "수업 외 관리" }
    - { headline: "체육교육 전공 대표 PT", description: "체육교육과 졸업 대표가 운동 원리를 설명하며 1:1로 지도합니다.", hypothesis: "전문성(학력)" }

notify:
  # 비밀값은 .env 의 SLACK_WEBHOOK_URL / TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID

storage:
  db_path: data/autopilot.db
  plans_dir: data/plans
  reports_dir: data/reports
