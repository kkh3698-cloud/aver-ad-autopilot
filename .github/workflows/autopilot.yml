# 하루 2번 자동 실행 (사장님 컴퓨터가 꺼져 있어도 GitHub 서버에서 무료로 돌아갑니다)
# 순위 확인 → 광고 데이터 수집 → 승인된 소재 반영/교체 → 인기 콘텐츠 수집 → 새 소재 제안(이슈) → 대시보드 갱신
name: 정기 실행
on:
  schedule:
    - cron: "17 0,9 * * *"   # 한국시간 09:17, 18:17 (GitHub 사정으로 몇 분~수십 분 늦을 수 있음)
  workflow_dispatch: {}       # Actions 탭에서 [Run workflow] 로 지금 바로 실행

permissions:
  contents: write   # 실행 기록(DB)을 autopilot-data 브랜치에 저장
  issues: write     # 승인 요청 이슈·대시보드

concurrency:
  group: autopilot            # 승인 처리와 겹치지 않게 한 번에 하나만
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: autopilot-data, path: data }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m naver_growth run
        env:
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_OPENAPI_CLIENT_ID: ${{ secrets.NAVER_OPENAPI_CLIENT_ID }}
          NAVER_OPENAPI_CLIENT_SECRET: ${{ secrets.NAVER_OPENAPI_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 실행 기록 저장
        if: always()
        working-directory: data
        run: |
          git config user.name "autopilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -qm "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:autopilot-data
